services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loanapp
      POSTGRES_PASSWORD: local-demo-only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanapp -d loans"]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-service:
    build: ./services/customer-service
    environment:
      DATABASE_URL: postgresql://loanapp:local-demo-only@postgres:5432/loans
    ports: ["8082:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  document-service:
    build: ./services/document-service
    ports: ["8083:8080"]

  notification-service:
    build: ./services/notification-service
    ports: ["8084:8080"]

  loan-service:
    build: ./services/loan-service
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      DOCUMENT_SERVICE_URL: http://document-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports: ["8081:8080"]
    depends_on: [customer-service, document-service, notification-service]

  frontend:
    build: ./services/frontend
    environment:
      LOAN_SERVICE_URL: http://loan-service:8080
    ports: ["8080:8080"]
    depends_on: [loan-service]

volumes:
  pgdata:
