---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend, version: v1}
  template:
    metadata:
      labels: {app: frontend, version: v1}
    spec:
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/project-kuber-513108/loan-platform/frontend:1.0.0
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        env:
        - name: LOAN_SERVICE_URL
          value: http://loan-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
  - port: 8080
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: loan-service, version: v1}
  template:
    metadata:
      labels: {app: loan-service, version: v1}
    spec:
      containers:
      - name: loan-service
        image: us-central1-docker.pkg.dev/project-kuber-513108/loan-platform/loan-service:1.0.1
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        env:
        - name: CUSTOMER_SERVICE_URL
          value: http://customer-service:8080
        - name: DOCUMENT_SERVICE_URL
          value: http://document-service:8080
        - name: NOTIFICATION_SERVICE_URL
          value: http://notification-service:8080
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: postgresql://loanapp:$(POSTGRES_PASSWORD)@postgres:5432/loans
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
spec:
  selector: {app: loan-service}
  ports:
  - port: 8080
    targetPort: 8080

