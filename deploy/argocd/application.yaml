apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loan-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/loan-platform-gitops.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: loan-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
